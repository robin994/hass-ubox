name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version (must match ubox/config.yaml)
        required: true
        default: 0.8.3

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use a PAT secret with write:packages (GITHUB_TOKEN may lack it):
          # Settings -> Secrets -> Actions -> GHCR_PAT.
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ubox
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-ubox:${{ env.VERSION }}
