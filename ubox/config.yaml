name: UBox Camera
version: "0.8.2"
slug: ubox
description: UBox camera live stream for Home Assistant (local, on-demand MJPEG with auto-reconnect)
url: https://github.com/robin994/hass-ubox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
hassio_api: false
homeassistant_api: false
privileged:
  - NET_ADMIN
full_access: false
apparmor: true
map: []
# No "image:" key: the Supervisor builds the add-on locally from the
# Dockerfile (a few minutes on first install). To use prebuilt images,
# run the GitHub workflow and add:
#   image: ghcr.io/<your-github-user>/{arch}-addon-ubox
#
# This tab is authoritative: on (re)start these options win over edits
# made on the add-on web page.
options:
  http_username: ubox
  http_password: ""
  stream: 1
  fps: 0
  jpeg_quality: 5
  max_width: 0
  idle_timeout: 60
  stall_timeout: 20
  live_mode: single
schema:
  http_username: str
  http_password: password
  stream: int(0,99)
  fps: int(0,30)
  jpeg_quality: int(2,31)
  max_width: int(0,3840)
  idle_timeout: int(15,3600)
  stall_timeout: int(8,300)
  live_mode: list(single|failover)
ports_description:
  8089/tcp: Live MJPEG + snapshots + status
